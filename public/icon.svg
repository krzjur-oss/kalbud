<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Square Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Decorative Grid / Blueprint Pattern Subtle Background -->
  <path d="M 0 128 L 512 128 M 0 256 L 512 256 M 0 384 L 512 384 M 128 0 L 128 512 M 256 0 L 256 512 M 384 0 L 384 512" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
  
  <!-- House Roof & Structure -->
  <path d="M 256 96 L 416 224 H 368 V 384 H 144 V 224 H 96 Z" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Inner Ruler / Shovel motif -->
  <path d="M 256 160 L 320 212 V 336 H 192 V 212 Z" fill="url(#gold)" opacity="0.9"/>
  
  <!-- "K" Letter Accent inside house -->
  <path d="M 230 240 V 310 M 230 275 L 270 240 M 230 275 L 270 310" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Bottom Foundation Bar -->
  <rect x="112" y="384" width="288" height="28" rx="8" fill="url(#gold)"/>
  
  <!-- Text Label KALBUD -->
  <text x="256" y="452" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" letter-spacing="4">KALBUD</text>
</svg>
